name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --continue 2>&1 | tee build.log || {
            echo "::notice title=Build::$(grep -E -A3 'error:|What went wrong|Could not' build.log | head -150 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: kryns-waypoints
          path: '*/build/libs/kryns-waypoints-*.jar'

      - name: Version lesen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Altes Release entfernen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.version }}" --cleanup-tag -y || true

      - name: Release erstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: v${{ steps.version.outputs.version }}
          name: Kryn´s Waypoints ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Kryn´s Waypoints ${{ steps.version.outputs.version }} für Minecraft 26.3+.
            Fabric (mit Fabric API), NeoForge oder Forge: die passende .jar in den `mods`-Ordner legen.
          files: '*/build/libs/kryns-waypoints-*-${{ steps.version.outputs.version }}.jar'
