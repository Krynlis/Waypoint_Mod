name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Versionen anzeigen
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Minecraft aus gradle.properties: $MC"
          echo "--- Neueste Minecraft-Versionen bei Fabric:"
          curl -s https://meta.fabricmc.net/v2/versions/game | jq -r '.[0:8][] | "\(.version) stable=\(.stable)"'
          echo "--- Neuester Loader:"
          curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version'
          echo "--- Fabric API für $MC:"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | tail -3
          echo "--- Loom:"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kryns-waypoints
          path: build/libs/*.jar
