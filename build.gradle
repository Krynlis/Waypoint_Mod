// Gemeinsame Einstellungen für alle Loader-Projekte. Der Code liegt in common/ und wird in jedes Loader-Jar mitkompiliert.
subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "kryns-waypoints-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    sourceSets.main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = 'UTF-8'
    }

    processResources {
        def props = [version: rootProject.mod_version, minecraft_version: rootProject.minecraft_version]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
            expand props
        }
    }
}
