plugins {
    id 'java'
}

version = rootProject.mod_version

base {
    archivesName = 'kryns-waypoints-relay'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'de.kryn.waypoints.relay.RelayServer'
    }
}
